services:
  drc_rover_container:
    build:
      context: ../../
      dockerfile: docker/rover/Dockerfile
    container_name: drc_rover_container
    restart: unless-stopped
    
    # Nutné pro Jetson Orin NX (CUDA / VPI / TensorRT)
    runtime: nvidia
    
    # Síť a IPC
    network_mode: host
    ipc: host
    shm_size: '512m'
    
    # Přístup k hardwaru (sériové porty pro FCU, USB kamery, GPIO)
    privileged: true
    
    volumes:
      # Mapování zdrojových kódů
      - ../../src/drone_follow:/workspace/src/drone_follow:rw
      - ../../src/rover_drone_following:/workspace/src/rover_drone_following:rw
      - ../../src/rover_mavlink_communication:/workspace/src/rover_mavlink_communication:rw
      - ../../src/rover_navigation:/workspace/src/rover_navigation:rw
      
      # Přístup k zařízením v /dev
      - /dev:/dev:rw
      # Synchronizace času
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # GUI přístup přes X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:ro
      
    environment:
      - ROS_DOMAIN_ID=67
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      - RCUTILS_LOGGING_BUFFERED_STREAM=1
      - RCUTILS_COLORIZED_OUTPUT=1

    command: tail -f /dev/null